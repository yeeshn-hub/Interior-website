<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>방꾸미기 아이템 모음</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F1E9;--surface:#FFFFFF;--ink:#3A2E26;--muted:#6B5C50;--line:#E3D6C2;--accent:#3A2E26;--accent-ink:#F6F1E9;--tint:#EADFCE;--green:#4F5F41;--font-display:"Noto Serif KR","Batang",serif;--font-body:"Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.6;font-size:16px}
a{color:inherit}button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
.notice{background:#3A2E26;color:#F6F1E9;font-size:13px;text-align:center;padding:10px 20px}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-top:18px;padding-bottom:18px}
.logo{font-family:var(--font-display);font-weight:700;font-size:22px;text-decoration:none}
nav.main{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:15px}
.navbtn{border:1px solid var(--line);background:transparent;padding:8px 16px;border-radius:999px;font-size:14px;min-height:44px;text-decoration:none;display:inline-flex;align-items:center}
.navbtn[aria-pressed="true"]{background:var(--ink);color:var(--accent-ink);border-color:var(--ink)}
.navbtn[aria-current="page"]{border-color:var(--ink);font-weight:700}
.linkbtn{text-decoration:none;display:inline-flex;align-items:center}
.pill{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--tint);font-weight:500}
.intro{padding:28px 0 16px;display:grid;gap:14px}
.intro h1{font-family:var(--font-display);font-size:clamp(28px,5vw,40px);line-height:1.25;margin:0;text-wrap:balance}
.intro p{margin:0;color:var(--muted);max-width:60ch}
.search{display:flex;gap:8px;max-width:520px}
.search input{flex:1;min-width:0;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit}
.strip{display:flex;gap:12px 20px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--tint);border-radius:16px;padding:16px 20px;margin-bottom:20px}
.strip span{display:block;color:var(--muted);font-size:14px}
.filters{display:grid;gap:10px;padding:4px 0 16px}
.fgroup{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fgroup .lab{font-size:13px;color:var(--muted);min-width:64px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-size:14px;min-height:44px;text-decoration:none;display:inline-flex;align-items:center}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--accent-ink);border-color:var(--ink)}
.count{font-size:14px;color:var(--muted);padding-bottom:12px;margin:0}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));padding-bottom:48px}
.pc{position:relative}.pcl{text-decoration:none;display:block}
.sq{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:4/5;background:#2A211B}
.sq img,.sq .fb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.fb svg{width:100%;height:100%;display:block}
.sq .lab{position:absolute;left:12px;bottom:12px;background:rgba(246,241,233,.94);padding:4px 12px;border-radius:999px;font-weight:700;font-size:14px}
.pc .meta{display:grid;gap:2px;padding:10px 4px 0}.pc .t{font-size:14px;font-weight:500}.pc .s{font-size:12px;color:var(--muted)}
.save{position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#3A2E26;display:grid;place-items:center}
.save[aria-pressed="true"]{background:var(--ink);color:#fff}.save svg{width:20px;height:20px}
.empty{padding:40px 0;color:var(--muted)}
.crumb{padding:6px 0 14px;font-size:13px;color:var(--muted)}
.dsplit{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start;padding-bottom:48px}
.stagecol{flex:1 1 520px;min-width:0}
.stage{position:relative;border-radius:20px;overflow:hidden;background:#2A211B;width:100%;max-height:78vh}
.stage img,.stage .fb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.88);font-size:22px;line-height:1;z-index:2}
.arrow.l{left:12px}.arrow.r{right:12px}
.dots{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;background:rgba(42,33,27,.6);border-radius:999px;padding:0 6px;z-index:2}
.dots button{width:44px;height:32px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;padding:0}
.dots i{display:block;width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.45)}
.dots button[aria-current="true"] i{background:#fff}
.info{flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:18px}
.info h1{margin:0;font-family:var(--font-display);font-size:clamp(28px,4.6vw,42px);line-height:1.25}
.info p{margin:0;color:#4A3D33}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:13px;padding:4px 12px;border-radius:999px;background:var(--tint)}.tag.g{background:#E4EADB;color:#34422A}
.kv{display:grid;gap:8px}.kv b{font-size:14px}
.sws{display:flex;flex-wrap:wrap;gap:14px}.swc{display:flex;align-items:center;gap:8px;font-size:14px}
.swd{width:28px;height:28px;border-radius:50%;display:inline-block}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.cta{background:var(--ink);color:var(--accent-ink);border:0;padding:10px 18px;border-radius:12px;font-weight:700;font-size:14px;min-height:44px;text-decoration:none}
.cta.big{padding:12px 22px;font-size:15px}.cta[disabled]{opacity:.55;cursor:default}
.band{background:#FFFDF9;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -20px;padding:44px 20px}
.band h2,.more h2,.neighbors h2,.items h2{font-family:var(--font-display);margin:0 0 4px}
.band h2{font-size:28px}.sub{color:var(--muted);font-size:14px;margin:0 0 20px}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.icard{background:#fff;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line)}
.itone{height:130px;display:flex;align-items:flex-end;padding:14px}.itone span{font-size:12px;color:#4A3A2E}
.ibody{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.ibody .k{font-size:12px;color:var(--muted)}.ibody h3{margin:0;font-size:17px}.ibody p{margin:0;font-size:14px;color:#5A4C41;flex:1}
.pb{font-size:14px;font-weight:700;color:var(--muted)}
.route{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--muted);word-break:break-all}
.disc{font-size:13px;color:var(--muted);margin:20px 0 0}
.more{padding:40px 0 20px;display:grid;gap:14px}.more h2{font-size:22px}
.neighbors .sub{margin-bottom:14px}
footer{background:#3A2E26;color:#EADFCE;padding:32px 0;font-size:14px}footer .wrap{display:grid;gap:8px}footer b{color:#F6F1E9}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);width:min(92vw,460px);background:#3A2E26;color:#F6F1E9;padding:12px 16px;border-radius:12px;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:9}
#toast[hidden]{display:none}
.back{display:inline-block;margin:24px 0 12px;font-size:14px;color:var(--muted)}
.detail{display:grid;gap:28px;padding-bottom:48px}
.thumb{display:block;aspect-ratio:8/5;overflow:hidden}
.thumb svg,.hero svg{display:block;width:100%;height:100%}.thumb img,.hero img{display:block;width:100%;height:100%;object-fit:cover}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card .body{padding:14px 16px 16px;display:grid;gap:8px}.card h3{margin:0;font-size:17px}.card h3 a{text-decoration:none}
.hero{border-radius:16px;overflow:hidden;aspect-ratio:8/5;max-height:420px;width:100%;border:1px solid var(--line)}
.dhead{display:grid;gap:10px}.dhead h1{font-family:var(--font-display);margin:0;font-size:clamp(24px,4.5vw,34px);line-height:1.25}.dhead p{margin:0;max-width:62ch}
.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px;align-content:start}
.box h2{margin:0;font-size:14px;font-weight:700}
.ilist{display:grid;gap:12px}
.note{background:var(--tint);border-radius:10px;padding:10px 14px;font-size:14px;margin:0 0 16px}
.rules{margin:0 0 16px;padding:0 0 0 18px;color:var(--muted);font-size:14px;display:grid;gap:2px}
.form summary{cursor:pointer;font-weight:700;font-size:16px}.form form{display:grid;gap:14px;margin-top:14px}
.fl{display:grid;gap:6px;font-size:14px;font-weight:500}
.fl input[type="text"],.fl select,.fl textarea{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-weight:400;width:100%}
.frow2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.seg{border:0;padding:0;margin:0;display:flex;gap:8px 18px;flex-wrap:wrap;font-size:15px}.seg legend{font-size:14px;font-weight:500;padding:0;margin-bottom:6px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px}.chk input{margin-top:4px}
.hint{margin:0;font-size:13px;color:var(--muted)}
.frow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.frow .msg{font-size:14px;color:var(--muted)}
.prev{max-width:240px;border-radius:10px;border:1px solid var(--line)}
.kind-help{background:var(--ink);color:var(--accent-ink)}.kind-share{background:#E4EADB;color:#34422A}
.who{font-size:13px;color:var(--muted)}.pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.cmt{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px}
.cmt .head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.badge{font-size:12px;padding:1px 8px;border-radius:999px;background:var(--tint)}
.rec{display:grid;grid-template-columns:88px 1fr;gap:12px;align-items:center;text-decoration:none;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.rec .m{aspect-ratio:8/5}.rec .m svg{display:block;width:100%;height:100%}.rec span{padding-right:10px;font-size:14px}.rec small{display:block;color:var(--muted);font-size:12px}
.mini{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;font-size:13px;min-height:44px}
.mini[aria-pressed="true"]{background:var(--ink);color:var(--accent-ink)}.mini[disabled]{opacity:.5;cursor:default}
@media (prefers-reduced-motion:no-preference){.sq img{transition:transform .25s ease}.pc:hover .sq img{transform:scale(1.03)}}

.gate{max-width:480px;margin:48px auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px 24px;display:grid;gap:16px}
.gate h1{font-family:var(--font-display);margin:0;font-size:28px;line-height:1.3}
.gate p{margin:0;color:var(--muted);font-size:15px}
.gate input[type="email"]{padding:12px 14px;border-radius:12px;border:1px solid var(--line);font:inherit;width:100%;background:var(--bg);color:var(--ink)}
.profgrid{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));padding-bottom:48px;align-items:start}.h2s{font-family:var(--font-display);font-size:20px;margin:0 0 8px}.note a{text-decoration:underline}
.itone.has{height:200px;padding:0;position:relative;overflow:hidden}.itone.has img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pb{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;font-size:14px;color:var(--muted)}
.pb .pr{font-size:18px;color:var(--ink)}.pb s{color:var(--muted)}.pb .pill{font-size:11px}
.pb .asof{flex-basis:100%;font-size:12px;color:var(--muted)}
.coupon{margin:0 0 18px;background:#fff;border:2px dashed var(--green);border-radius:14px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between}
.coupon b{font-size:18px;display:block}.coupon span{font-size:14px;color:var(--muted)}
.coupon .cbox{display:flex;gap:10px;align-items:center}
.coupon code{font-size:20px;font-weight:800;letter-spacing:.04em;background:var(--tint);padding:8px 14px;border-radius:10px;user-select:all}
</style>
</head>
<body>
<div class="notice">이 사이트는 테무 제휴 마케팅 활동의 일환으로, 링크를 통해 구매하면 운영자가 수수료를 받을 수 있어요. 구매 가격은 달라지지 않아요.</div>
<header class="top"><div class="wrap">
  <a class="logo" href="#shop">방꾸미기 아이템</a>
  <nav class="main" aria-label="주요 메뉴">
    <a class="navbtn" id="navShop" href="#shop">테무 아이템</a>
    <a class="navbtn" id="navBoard" href="#board">우리 방 이야기</a>
    <a class="navbtn" href="#about">소개</a>
    <a class="navbtn" id="navProfile" href="#profile">내 프로필</a>
  </nav>
</div></header>
<main class="wrap" id="app"></main>
<footer><div class="wrap">
  <b>제휴 고지</b>
  <span>이 사이트는 테무 제휴 마케팅 활동의 일환으로, 링크를 통해 구매하면 운영자가 수수료를 받을 수 있어요. 구매 가격은 달라지지 않아요. 가격과 재고는 판매처에서 달라질 수 있어요.</span>
  <span>이웃이 올린 사진과 글은 사이트의 의견이 아니며, 신고가 3건 쌓인 글은 목록에서 숨겨집니다.</span>
</div></footer>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script>

const HOME_ROOMS = ['거실', '침실', '원룸', '작업방'];

/* 디자이너 시안(컨셉 9개, 사진 27장, 아이템 72개)의 문구와 데이터를 그대로 옮김 */
function mk(id, name, rooms, tags, pal, head, desc, colors, mat, photos, items, p, v) {
  return {
    id: id, name: name, rooms: rooms, tags: tags, pal: pal, head: head, desc: desc, colors: colors, mat: mat,
    photos: photos.map(function (x) { return { src: x[0].indexOf('data:') === 0 ? x[0] : '/_blob/' + x[0], r: x[1], alt: x[2] }; }),
    items: items.map(function (x, i) { return { id: i + 1, name: x[0], kind: x[1], reason: x[2], tone: x[3] }; }),
    p: p, v: v
  };
}
const C = [
mk('minimal', '미니멀', ['거실', '침실'], '거실 · 침실 · 베이지 톤', '베이지 · 화이트 · 우드', '덜어내서 더 넓어지는 방',
 '가구 수를 줄이고 베이지와 우드, 숨겨 둔 간접 조명만 남겼어요. 벽 위로 번지는 은은한 불빛과 바닥을 덮는 두툼한 러그가 호텔 같은 차분함을 만들어요.',
 [['크림', '#EDE4D6'], ['베이지', '#CDB89B'], ['라이트우드', '#C9A57A'], ['딥브라운', '#3B2F28']], '원목 · 린넨 · 울 · 유리',
 [['x', 0.7767, '우드 슬랫 벽과 간접 조명, 베이지 코너 소파와 라운드 테이블이 있는 미니멀 거실'],
  ['x', 1.3151, '구형 펜던트 조명과 낮은 플랫폼 침대, 크림색 침구가 있는 미니멀 침실'],
  ['x', 1.6258, '올리브 나무와 부클레 의자, 낮은 수납장과 라운드 테이블이 있는 미니멀 거실 코너'],
  ['x', 1.7308, '베이지 소파와 종이 구형 펜던트, 우드 슬랫 벽, 큰 통창이 있는 미니멀 거실'],
  ['x', 1.3274, '낮은 원목 침대와 흰 침구, 미닫이 격자 문과 얇은 커튼이 있는 밝은 미니멀 침실'],
  ['x', 1.2222, '황동 아치 플로어 램프와 부클레 의자, 올리브 나무가 있는 미니멀 코너']],
 [['우드 슬랫 벽패널', '마감', '붙이기만 해도 TV 벽이 단정하고 고급스러워 보여요.', '#D8BE96'],
  ['플로팅 TV 수납장', '수납', '바닥이 보여서 좁은 방도 가볍고 넓어 보여요.', '#C9A57A'],
  ['우드 톤 플로어 스탠드', '조명', '모서리에 두면 천장등 없이도 은은한 분위기가 나요.', '#F2D9A0'],
  ['라운드 커피테이블', '가구', '모서리가 없어 동선이 부드럽고 소파 앞이 정돈돼 보여요.', '#B98B5E'],
  ['베이지 샤기 러그', '패브릭', '두툼한 질감이 마루 바닥과 소파 사이를 포근하게 이어요.', '#E4D8C6'],
  ['화이트 시어 커튼', '패브릭', '낮 동안 빛을 부드럽게 퍼뜨려서 방이 밝고 차분해져요.', '#EFE9DE'],
  ['구형 펜던트 조명', '조명', '침대 옆에 하나만 늘어뜨려도 방의 중심이 잡혀요.', '#F3EBD2'],
  ['화이트 코튼 침구 세트', '패브릭', '흰색 한 가지로 맞추면 침실이 가장 넓어 보여요.', '#F4F0E8']],
 { wall: '#EDE4D6', floor: '#C9A57A', acc: '#CDB89B', furn: '#A98B6A', d: '#E4D8C6', deco: 'frames', sky: '#E9EEF2' }, 'sofa'),
mk('nordic', '북유럽', ['거실'], '거실 · 오크 · 블루 포인트', '오크 · 크림 · 블루', '햇빛이 오래 머무는 오후의 거실',

function chips(label, key, list) {
  let h = '<div class="fgroup" role="group" aria-label="' + label + '"><span class="lab">' + label + '</span>';
  ['전체'].concat(list).forEach(function (o) {
    h += '<button type="button" class="chip" data-act="filter" data-key="' + key + '" data-val="' + o + '" aria-pressed="' + (state[key] === o) + '">' + o + '</button>';
  });
  return h + '</div>';
}
function matches(c) {
  if (state.style !== '전체' && c.name !== state.style) return false;
  if (state.room !== '전체' && c.rooms.indexOf(state.room) === -1) return false;
  if (state.savedOnly && !saved.has(c.id)) return false;
  const q = state.q.trim();
  if (q) {
    const hay = [c.name, c.tags, c.pal, c.head, c.desc, c.mat].concat(c.items.map(function (i) { return i.name + ' ' + i.kind; })).join(' ');
    if (hay.indexOf(q) === -1) return false;
  }
  return true;
}

  const n = parseInt(hex.slice(1), 16);
  return (((n >> 16) & 255) + ((n >> 8) & 255) + (n & 255)) / 3 > 225;
}

  const act = t.getAttribute('data-act');
  if (act === 'filter') {
    state[t.getAttribute('data-key')] = t.getAttribute('data-val');
    document.querySelectorAll('.chip[data-act="filter"][data-key="' + t.getAttribute('data-key') + '"]').forEach(function (b) {
      b.setAttribute('aria-pressed', b === t ? 'true' : 'false');
    });
    renderGrid();
  } else if (act === 'save') {
    const id = t.getAttribute('data-id');
    if (saved.has(id)) saved.delete(id); else saved.add(id);
    persist();
    if (document.getElementById('results')) renderGrid();
    else { t.setAttribute('aria-pressed', saved.has(id)); t.textContent = saved.has(id) ? '저장됨' : '이 컨셉 저장'; }
    updateChrome();

    clicks += 1; updateChrome();
    toast('샘플 화면입니다. 아직 연결된 링크가 없어요. 테무 아이템 메뉴에서 상품 링크를 확인해 보세요.');
  } else if (act === 'photo' || act === 'dot') {

  }
});

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]; }); }
function shownNick(x) { return mine(x) && myNick ? myNick : (x.nick && validNick(String(x.nick)) ? x.nick : nick(x.uid)); }
function nick(u) { return u ? '이웃 ' + String(u).replace(/[^A-Za-z0-9]/g, '').slice(-4) : '이웃'; }
function ago(ts) {
  const s = Math.max(0, (Date.now() - Number(ts || 0)) / 1000);
  if (s < 60) return '방금 전';
  if (s < 3600) return Math.floor(s / 60) + '분 전';
  if (s < 86400) return Math.floor(s / 3600) + '시간 전';
  return Math.floor(s / 86400) + '일 전';
}
function safePhoto(p) { return typeof p === 'string' && p.indexOf('data:image/jpeg;base64,') === 0 ? p : ''; }
function conceptById(id) { return C.find(function (x) { return x.id === id; }); }
function countKeys(o) { return o && typeof o === 'object' ? Object.keys(o).length : 0; }
function canPost() { return !readOnly && (db ? !!uid : true); }

async function initCommunity() {
  if (typeof claude === 'undefined' || !claude || !claude.use) { startLocal(); return; }
  let u = null;
  try { u = await claude.use('user'); } catch (e) { u = null; }
  if (u) {
    try { uid = await u.id(); } catch (e) {}
    try { isMod = !!(u.canEdit() || u.isOwner()); } catch (e) {}
    try { if (u.can('data.write') === false) readOnly = true; } catch (e) {}
  }
  try { db = await claude.use('db'); } catch (e) { db = null; }
  if (db) subscribePosts(); else startLocal();
}
function startLocal() { db = null; uid = 'local'; boardReady = true; refreshCommunity(); }
function subscribePosts() {

    clearTimeout(boardTimer); boardSlow = false; boardReady = true; boardErr = '';

  else if (code === 'quota_exceeded') msgEl.textContent = '저장 공간이 가득 찼습니다. 오래된 글을 삭제한 뒤 다시 시도해 주세요.';
  else msgEl.textContent = '저장하지 못했습니다. 잠시 뒤 다시 시도해 주세요.';

}

/* photo: resize on this device, re-encode as JPEG (drops EXIF/location), keep under the 256 KiB document limit */
function shrink(file) {
  return new Promise(function (resolve, reject) {
    if (!file || file.type.indexOf('image/') !== 0) { reject(new Error('type')); return; }
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = function () {
      URL.revokeObjectURL(url);
      let max = 800;
      for (let round = 0; round < 4; round++) {
        const r = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * r)); c.height = Math.max(1, Math.round(img.height * r));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        let q = 0.72, out = c.toDataURL('image/jpeg', q);
        while (out.length > 150000 && q > 0.4) { q -= 0.08; out = c.toDataURL('image/jpeg', q); }
        if (out.length <= 150000) { resolve(out); return; }
        max = Math.round(max * 0.78);
      }
      reject(new Error('size'));
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('decode')); };
    img.src = url;
  });
}

document.addEventListener('click', function (e) {
  const cb = e.target.closest('[data-act="copycode"]');
  if (!cb) return;
  const code = 'ali713008';
  const done = function () { toast('할인 코드를 복사했어요: ' + code); };
  const fallback = function () {
    try {
      const r = document.createRange(); r.selectNodeContents(document.getElementById('cpcode'));
      const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      if (document.execCommand && document.execCommand('copy')) { done(); return; }
    } catch (err) {}
    toast('코드를 길게 눌러 복사해 주세요: ' + code);
  };
  try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(code).then(done, fallback); } else { fallback(); } } catch (err) { fallback(); }
});

  document.getElementById('navProfile').setAttribute('aria-current', view.t === 'profile' ? 'page' : 'false');
  updateChrome();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();
initCommunity().then(loadProfile);
</script>
